specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: USPTO
providerId: uspto
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Federal Government
  - Intellectual Property
  - Rate Limiting
description: USPTO does not publish a unified API rate-limit policy. Some APIs (e.g. TSDR) require a free API key and reference per-API "API Key Usage FAQs" for quotas; specific per-second numbers are documented at the individual API level rather than centrally. Migration to data.uspto.gov is in progress.
sources:
  - https://developer.uspto.gov/
  - https://developer.uspto.gov/api-catalog
notes: No central rate-limit page; each USPTO API documents its own key-usage policy. Consumers should consult the FAQ/User Guide for the specific endpoint they integrate.
responseCodes:
  throttled: 429
limits:
  - name: Per-API Key Usage Policy
    scope: key
    metric: varies
    limit: see per-API FAQ (e.g. TSDR API Key Usage FAQs)
policies:
  - name: Per-API Documentation
    description: Each USPTO API exposes its own key-usage and quota documentation; consumers should review the relevant FAQ before integrating.
  - name: Bulk Data Alternative
    description: For high-volume access, USPTO offers bulk data downloads via the Bulk Data Storage System; prefer those over high-frequency API polling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
