naftiko: "1.0.0-alpha1"

info:
  label: USPTO Patent & Trademark API
  description: >-
    The United States Patent and Trademark Office (USPTO) REST API provides
    access to patent applications, granted patents, PTAB trial proceedings,
    trademark status, patent assignments, and citation data via the Open Data
    Portal at data.uspto.gov and developer.uspto.gov.
  tags:
    - Assignments
    - Government
    - Intellectual Property
    - Open Data
    - Patents
    - PTAB
    - Regulatory
    - Trademarks
    - USPTO
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      USPTO_API_KEY: USPTO_API_KEY

capability:
  consumes:
    - type: http
      namespace: uspto-patent-api
      baseUri: https://data.uspto.gov/api/v1
      description: USPTO Open Data Portal REST API
      authentication:
        type: apikey
        key: X-API-KEY
        value: "{{USPTO_API_KEY}}"
        placement: header
      resources:
        - name: patent-applications
          path: /patent/applications
          description: Patent application search and retrieval
          operations:
            - name: search-patent-applications
              method: GET
              description: Search USPTO patent applications by keyword, inventor, assignee, and other criteria
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: false
                  description: Keyword search query
                - name: inventor
                  in: query
                  type: string
                  required: false
                  description: Inventor name
                - name: assignee
                  in: query
                  type: string
                  required: false
                  description: Assignee company name
                - name: filingDateStart
                  in: query
                  type: string
                  required: false
                  description: Filing date range start (YYYY-MM-DD)
                - name: filingDateEnd
                  in: query
                  type: string
                  required: false
                  description: Filing date range end (YYYY-MM-DD)
                - name: cpcClassification
                  in: query
                  type: string
                  required: false
                  description: CPC classification code
                - name: patentType
                  in: query
                  type: string
                  required: false
                  description: Patent type (UTILITY, DESIGN, PLANT, REISSUE)
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Application status
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: Pagination offset
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Results per page (max 100)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-patent-application
              method: GET
              description: Get full details for a specific patent application
              inputParameters:
                - name: applicationNumber
                  in: path
                  type: string
                  required: true
                  description: USPTO application number
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: patent-grants
          path: /patent/grants
          description: Granted patent retrieval
          operations:
            - name: get-granted-patent
              method: GET
              description: Get full details for a granted USPTO patent by patent number
              inputParameters:
                - name: patentNumber
                  in: path
                  type: string
                  required: true
                  description: USPTO patent number
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ptab-trials
          path: /ptab/trials
          description: PTAB trial proceeding search and retrieval
          operations:
            - name: search-ptab-trials
              method: GET
              description: Search PTAB IPR, PGR, and CBM trial proceedings
              inputParameters:
                - name: patentNumber
                  in: query
                  type: string
                  required: false
                  description: Challenged patent number
                - name: petitionerName
                  in: query
                  type: string
                  required: false
                  description: Petitioner company name
                - name: patentOwnerName
                  in: query
                  type: string
                  required: false
                  description: Patent owner name
                - name: proceedingType
                  in: query
                  type: string
                  required: false
                  description: Proceeding type (IPR, PGR, CBM)
                - name: status
                  in: query
                  type: string
                  required: false
                  description: Trial status
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Results per page
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-ptab-trial
              method: GET
              description: Get full details for a specific PTAB trial proceeding
              inputParameters:
                - name: trialNumber
                  in: path
                  type: string
                  required: true
                  description: PTAB trial number (e.g., IPR2023-00001)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ptab-decisions
          path: /ptab/decisions
          description: PTAB decision search
          operations:
            - name: search-ptab-decisions
              method: GET
              description: Search PTAB decisions by trial number, date, or keyword
              inputParameters:
                - name: searchText
                  in: query
                  type: string
                  required: false
                  description: Full-text search in decision documents
                - name: proceedingType
                  in: query
                  type: string
                  required: false
                  description: Proceeding type
                - name: decisionType
                  in: query
                  type: string
                  required: false
                  description: Decision type
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Results per page
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: trademark-status
          path: /trademark/status
          description: Trademark status lookup
          operations:
            - name: get-trademark-status
              method: GET
              description: Get current status and prosecution history for a trademark by serial number
              inputParameters:
                - name: serialNumber
                  in: path
                  type: string
                  required: true
                  description: Trademark serial number (8 digits)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: patent-assignments
          path: /patent/assignments
          description: Patent assignment search
          operations:
            - name: search-patent-assignments
              method: GET
              description: Search recorded patent assignments and ownership transfers
              inputParameters:
                - name: patentNumber
                  in: query
                  type: string
                  required: false
                  description: Patent number
                - name: assignorName
                  in: query
                  type: string
                  required: false
                  description: Assignor name
                - name: assigneeName
                  in: query
                  type: string
                  required: false
                  description: Assignee name
                - name: conveyanceType
                  in: query
                  type: string
                  required: false
                  description: Assignment type
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Results per page
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: uspto-patent-api-rest
      resources:
        - path: /v1/patents
          name: patent-search
          description: Search patent applications
          operations:
            - method: GET
              name: search-patent-applications
              description: Search USPTO patent applications
              call: "uspto-patent-api.search-patent-applications"
              with:
                query: "rest.query"
                assignee: "rest.assignee"
                limit: "rest.limit"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/patents/{applicationNumber}
          name: patent-detail
          description: Get patent application details
          operations:
            - method: GET
              name: get-patent-application
              description: Get patent application by number
              call: "uspto-patent-api.get-patent-application"
              with:
                applicationNumber: "rest.applicationNumber"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/ptab/trials
          name: ptab-trial-search
          description: Search PTAB trial proceedings
          operations:
            - method: GET
              name: search-ptab-trials
              description: Search PTAB IPR/PGR/CBM proceedings
              call: "uspto-patent-api.search-ptab-trials"
              with:
                proceedingType: "rest.proceedingType"
                limit: "rest.limit"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/trademarks/{serialNumber}/status
          name: trademark-status
          description: Get trademark status
          operations:
            - method: GET
              name: get-trademark-status
              description: Get trademark status by serial number
              call: "uspto-patent-api.get-trademark-status"
              with:
                serialNumber: "rest.serialNumber"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/assignments
          name: patent-assignments
          description: Search patent assignments
          operations:
            - method: GET
              name: search-patent-assignments
              description: Search patent ownership assignments
              call: "uspto-patent-api.search-patent-assignments"
              with:
                assigneeName: "rest.assigneeName"
                limit: "rest.limit"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: uspto-patent-api-mcp
      transport: http
      tools:
        - name: search-patent-applications
          description: Search USPTO patent applications by keyword, inventor, assignee, or classification
          hints:
            readOnly: true
            openWorld: true
          call: "uspto-patent-api.search-patent-applications"
          with:
            query: "tools.query"
            inventor: "tools.inventor"
            assignee: "tools.assignee"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-patent-application
          description: Get full details for a specific patent application
          hints:
            readOnly: true
            idempotent: true
          call: "uspto-patent-api.get-patent-application"
          with:
            applicationNumber: "tools.applicationNumber"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-granted-patent
          description: Get full details for a granted patent by patent number
          hints:
            readOnly: true
            idempotent: true
          call: "uspto-patent-api.get-granted-patent"
          with:
            patentNumber: "tools.patentNumber"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-ptab-trials
          description: Search PTAB inter partes review and post-grant review proceedings
          hints:
            readOnly: true
            openWorld: true
          call: "uspto-patent-api.search-ptab-trials"
          with:
            patentNumber: "tools.patentNumber"
            proceedingType: "tools.proceedingType"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-trademark-status
          description: Get current status and prosecution history for a trademark serial number
          hints:
            readOnly: true
            idempotent: true
          call: "uspto-patent-api.get-trademark-status"
          with:
            serialNumber: "tools.serialNumber"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-patent-assignments
          description: Search recorded patent assignments and ownership transfers
          hints:
            readOnly: true
            openWorld: true
          call: "uspto-patent-api.search-patent-assignments"
          with:
            assigneeName: "tools.assigneeName"
            patentNumber: "tools.patentNumber"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
