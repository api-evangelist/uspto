specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: USPTO
providerId: uspto
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Federal Government
  - Intellectual Property
  - Open Data
  - Patents
  - Trademarks
description: USPTO patent and trademark APIs are free public services. The Open Data Portal Beta is migrating to data.uspto.gov by May 29, 2026. Several APIs (e.g. TSDR) require a free API key; per-key quotas are documented per-API rather than as a unified pricing tier.
sources:
  - https://developer.uspto.gov/
  - https://developer.uspto.gov/api-catalog
  - https://data.uspto.gov/
plans:
  - id: uspto-public
    name: Public Open Data Access
    type: freemium
    description: Free public access to USPTO patent and trademark data services. Some APIs require a free API key (e.g. TSDR) with per-API key-usage policies.
    entries:
      - label: Public API Access
        name: public_access
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
      - label: API Key (where required)
        name: api_key
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: Patent Examination Data API
      - name: Patent Application Data
      - name: Trademark Status & Document Retrieval (TSDR) Data API
      - name: Patent Trial and Appeal Board (PTAB) APIs
      - name: Bulk Data Storage System
      - name: Open Data Portal (migrating to data.uspto.gov)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
