description: 'FinOps shape for USPTO: free public patent/trademark APIs. There is no commercial billing surface. FinOps centers on key stewardship and using the Bulk Data Storage System for high-volume needs.'
sources:
  - https://developer.uspto.gov/
  - https://data.uspto.gov/
billingModel:
  pricingCategory: Free Public Service
  billingFrequency: None
  billingCurrency: USD
  chargeCategories: []
focusColumns:
  ServiceName: USPTO APIs
  ServiceCategory: Government Open Data
  ProviderName: U.S. Patent and Trademark Office
  PublisherName: U.S. Patent and Trademark Office
  InvoiceIssuerName: U.S. Patent and Trademark Office
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Requests against USPTO APIs (counts against per-API key-usage policy where applicable)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - api_key
  - name: bulk_downloads
    description: Bulk Data Storage System downloads (preferred for high-volume access)
    unit: file
    aggregation: count
principles:
  - name: Visibility
    description: Track usage via the per-API key-usage policy and FAQ; USPTO does not provide a centralized usage dashboard, so consumers should log their own request counts.
  - name: Allocation
    description: Allocate by application by issuing distinct USPTO API keys per app/team for APIs that require them (e.g. TSDR).
  - name: Optimization
    description: Use the Bulk Data Storage System for catalog-scale ingestion instead of per-record API polling; cache responses; align with the data.uspto.gov migration before May 29, 2026.
  - name: Accountability
    description: Owner is the application team holding the key; review key-usage FAQs and 429 responses to confirm the integration is operating within documented bounds.
maintainers:
